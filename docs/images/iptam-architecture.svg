<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">iPTAM architecture (explanatory illustration)</title>
  <desc id="desc">Explanatory diagram, not a screenshot: iPhone camera frames feed a tracking thread that detects FAST corners and estimates camera pose; a separate map-making thread adds keyframes and runs bundle adjustment on a shared map of points; results are drawn with OpenGL ES.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h { font-size: 17px; font-weight: 700; }
    .t { font-size: 13px; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #4b5563; }
    .note { font-size: 12px; fill: #6b7280; font-style: italic; }
    .flow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="24" y="34" class="h" style="font-size:20px">iPTAM: Parallel Tracking and Mapping ported to the iPhone</text>
  <text x="936" y="34" class="note" text-anchor="end">Explanatory illustration, not a screenshot</text>

  <!-- Camera -->
  <rect x="24" y="96" width="170" height="150" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="84" y="114" width="50" height="80" rx="9" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <circle cx="109" cy="132" r="7" fill="#374151"/>
  <text x="109" y="218" class="h" text-anchor="middle">Camera frames</text>
  <text x="109" y="236" class="m" text-anchor="middle">MyVideoBuffer</text>

  <!-- Tracker -->
  <rect x="236" y="70" width="300" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="386" y="98" class="h" text-anchor="middle">Tracking thread</text>
  <text x="254" y="124" class="t">• image pyramid + FAST corners</text>
  <text x="254" y="146" class="t">• patch search against map points</text>
  <text x="254" y="166" class="t">• per-frame camera pose</text>
  <text x="526" y="184" class="m" text-anchor="end">Tracker · Relocaliser</text>

  <!-- MapMaker -->
  <rect x="236" y="214" width="300" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="386" y="242" class="h" text-anchor="middle">Mapping thread</text>
  <text x="254" y="268" class="t">• two-view initialisation</text>
  <text x="254" y="290" class="t">• add keyframes and new points</text>
  <text x="254" y="310" class="t">• bundle adjustment</text>
  <text x="526" y="328" class="m" text-anchor="end">MapMaker · HomographyInit · Bundle</text>

  <!-- Map -->
  <rect x="580" y="140" width="160" height="130" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="660" y="168" class="h" text-anchor="middle">Shared map</text>
  <g fill="#f59e0b">
    <circle cx="616" cy="196" r="3.5"/><circle cx="640" cy="186" r="3.5"/><circle cx="668" cy="204" r="3.5"/>
    <circle cx="700" cy="190" r="3.5"/><circle cx="626" cy="218" r="3.5"/><circle cx="690" cy="222" r="3.5"/>
    <circle cx="654" cy="228" r="3.5"/><circle cx="712" cy="210" r="3.5"/>
  </g>
  <text x="660" y="244" class="m" text-anchor="middle">Map · KeyFrame</text>
  <text x="660" y="258" class="m" text-anchor="middle">MapPoint</text>

  <!-- Render -->
  <rect x="784" y="140" width="152" height="120" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="860" y="176" class="h" text-anchor="middle">Display</text>
  <text x="860" y="200" class="t" text-anchor="middle">OpenGL ES view</text>
  <text x="860" y="222" class="m" text-anchor="middle">EAGLView</text>
  <text x="860" y="240" class="m" text-anchor="middle">ES1Renderer</text>

  <!-- arrows -->
  <path d="M194,150 L232,134" class="flow"/>
  <path d="M536,130 L576,170" class="flow"/>
  <text x="548" y="118" class="note">tracks against</text>
  <path d="M536,276 L576,236" class="flow"/>
  <path d="M386,190 L386,210" class="flow"/>
  <text x="396" y="205" class="note">new keyframes</text>
  <path d="M740,200 L780,200" class="flow"/>

  <text x="24" y="364" class="note">Component names come from the source files in xPTAMclean/. The port is incomplete and unmaintained; see the report for details.</text>
</svg>
